<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
nav a{text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.3,1,.4,1),background-color .16s ease;}
nav a:active{transform:scale(.93);background-color:#F2EFFB;}
nav a:focus-visible{outline:2px solid #6C4DFF;outline-offset:-2px;}
@keyframes arbBadgePop{0%{transform:scale(.55);opacity:0}62%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
</style>
</helmet>

<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
<nav dir="rtl" aria-label="ناوبری اصلی موبایل" style="position:fixed;bottom:0;right:0;left:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #EAE6F4;box-shadow:0 -6px 24px rgba(23,21,31,.06);font-family:'Estedad',Tahoma,sans-serif;">

  <a href="./Home.dc.html" aria-current="{{ aHome }}" style="min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ cHome }};">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="{{ fHome }}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19Z"></path></svg>
    <span style="font-size:10.5px;font-weight:{{ wHome }};">خانه</span>
  </a>

  <a href="./Categories.dc.html" aria-current="{{ aCat }}" style="min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ cCat }};">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="{{ fCat }}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.2" height="7.2" rx="2.2"></rect><rect x="13.3" y="3.5" width="7.2" height="7.2" rx="2.2"></rect><rect x="3.5" y="13.3" width="7.2" height="7.2" rx="2.2"></rect><rect x="13.3" y="13.3" width="7.2" height="7.2" rx="2.2"></rect></svg>
    <span style="font-size:10.5px;font-weight:{{ wCat }};">دسته‌ها</span>
  </a>

  <a href="./Search.dc.html" aria-current="{{ aSearch }}" style="min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ cSearch }};">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sSearch }}" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
    <span style="font-size:10.5px;font-weight:{{ wSearch }};">جستجو</span>
  </a>

  <a href="./Cart.dc.html" aria-current="{{ aCart }}" style="position:relative;min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ cCart }};">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sCart }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h2.2l2 11h9.3l2-8H7"></path><circle cx="9.5" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg>
    <span style="font-size:10.5px;font-weight:{{ wCart }};">سبد</span>
    <span style="position:absolute;top:4px;left:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;animation:arbBadgePop .4s cubic-bezier(.3,1,.4,1) both;background:#22D3EE;color:#0B3B45;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">{{ cartCount }}</span>
  </a>

  <a href="./Account.dc.html" aria-current="{{ aUser }}" style="min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ cUser }};">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sUser }}" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.6" r="3.6"></circle><path d="M5 19.5c1.4-3.1 4-4.6 7-4.6s5.6 1.5 7 4.6"></path></svg>
    <span style="font-size:10.5px;font-weight:{{ wUser }};">حساب</span>
  </a>
</nav>
<div aria-hidden="true" style="height:calc(64px + env(safe-area-inset-bottom));"></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;home&quot;,&quot;categories&quot;,&quot;search&quot;,&quot;cart&quot;,&quot;account&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;۲&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobile: null };
  componentDidMount(){
    this.mq = window.matchMedia("(max-width: 767px)");
    this.sync = () => this.setState({ mobile: this.mq.matches });
    this.sync();
    if (this.mq.addEventListener) this.mq.addEventListener("change", this.sync);
    else this.mq.addListener(this.sync);
  }
  componentWillUnmount(){
    if (!this.mq) return;
    if (this.mq.removeEventListener) this.mq.removeEventListener("change", this.sync);
    else this.mq.removeListener(this.sync);
  }
  renderVals(){
    const a = this.props.active || "";
    const o = { show: this.state.mobile === true, cartCount: this.props.cartCount == null ? "۲" : this.props.cartCount };
    const keys = { Home: "home", Cat: "categories", Search: "search", Cart: "cart", User: "account" };
    Object.keys(keys).forEach((k) => {
      const on = a === keys[k];
      o["c" + k] = on ? "#4B32C3" : "#6E6880";
      o["w" + k] = on ? 700 : 500;
      o["a" + k] = on ? "page" : "false";
      o["f" + k] = on ? "#EDE9FA" : "none";
      o["s" + k] = on ? 2.1 : 1.7;
    });
    return o;
  }
}
</script>
</body>
</html>
