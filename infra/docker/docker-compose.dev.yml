name: arbyte-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbyte
      POSTGRES_PASSWORD: arbyte
      # G-03 — همان نام دیتابیس apps/backend/.env.example (Django).
      POSTGRES_DB: arbyte_dj
    # پورت 5432 روی هاست عمداً استفاده نشده — یکی از رایج‌ترین پورت‌هایی است
    # که نصب‌های محلی/سیستمی Postgres هم می‌گیرند (در T-003 دقیقاً همین برخورد
    # روی ماشین توسعه پیش آمد)؛ 5435 برخورد کمتری دارد. پورت داخلی کانتینر
    # همچنان استاندارد 5432 است.
    ports:
      - "5435:5432"
    volumes:
      - arbyte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbyte -d arbyte_dj"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arbyte_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arbyte_postgres_data:
  arbyte_redis_data:
